<!doctype html><html><head><meta charset="utf-8"><style>
body{font:14px -apple-system,Helvetica,Arial;width:300px;margin:12px;color:#2b2418}
h3{margin:0 0 8px;font-family:Georgia}label{display:block;margin:8px 0 2px;font-size:12px;color:#6b5d3e}
input{width:100%;box-sizing:border-box;padding:6px}button{margin-top:10px;padding:8px 10px;background:#c1a35f;border:0;border-radius:8px;color:#fff;font-weight:600;cursor:pointer}
#last{margin-top:10px;font-size:12px;padding:8px;border-radius:8px;background:#f4ede0}.bad{background:#fbe3df!important}
</style></head><body>
<h3>Lucy Optix</h3>
<div id="setup">
  <label>Office code (from the reporting team)</label><input id="office" placeholder="e.g. nicolas">
  <label>Lucy key</label><input id="key" placeholder="the key you were given">
  <label><input type="checkbox" id="dry" style="width:auto"> Test mode (send nothing)</label>
  <button id="save">Save</button>
</div>
<button id="now">Send my knocks now</button>
<div id="last">Keep Optix → Smart Leads → Lead Details open in a tab. Lucy reads it every 10 minutes.</div>
<script src="popup.js"></script></body></html>
