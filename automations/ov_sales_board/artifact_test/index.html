<title>Alphalete Sales Board</title>

<style>

  --grn-bg:#d6f1e5; --grn:#0c6a45; --blu-bg:#dbe6fb; --blu:#2450b8; --cya-bg:#d2f1f7; --cya:#0e6f86;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --ink:#e4eef2; --muted:#9db2bb; --faint:#7e959f; --line:rgba(228,238,242,.10);
  --navy:#06212b; --chip:#1b3640;
  --red-bg:#4a1d1a; --red:#ff9b94; --yel-bg:#47370f; --yel:#ffd76e; --grn-bg:#123d2c; --grn:#7ee2b0; --blu-bg:#1b2d55; --blu:#9cb8ff; --cya-bg:#0f3a44; --cya:#5eead4;
  --k-apps:#7fb2c4; --k-int:#e07a7a; --k-intup:#d99a5b; --k-dtv:#a493e0; --k-nl:#6fa8dc; --k-tk:#8bc27a; --k-cx:#e6c35c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0b1a20; --card:#11252d; --zebra:#142c35; --hover:#18343e;
  --ink:#e4eef2; --muted:#9db2bb; --faint:#7e959f; --line:rgba(228,238,242,.10);
  --navy:#06212b; --chip:#1b3640;
  --red-bg:#4a1d1a; --red:#ff9b94; --yel-bg:#47370f; --yel:#ffd76e; --grn-bg:#123d2c; --grn:#7ee2b0; --blu-bg:#1b2d55; --blu:#9cb8ff; --cya-bg:#0f3a44; --cya:#5eead4;
  --k-apps:#7fb2c4; --k-int:#e07a7a; --k-intup:#d99a5b; --k-dtv:#a493e0; --k-nl:#6fa8dc; --k-tk:#8bc27a; --k-cx:#e6c35c;
  color-scheme:dark}

button,select{font-family:inherit}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}

th.k-apps{border-bottom:3px solid var(--k-apps)}th.k-int{border-bottom:3px solid var(--k-int)}th.k-intup{border-bottom:3px solid var(--k-intup)}
th.k-dtv{border-bottom:3px solid var(--k-dtv)}th.k-nl{border-bottom:3px solid var(--k-nl)}th.k-tk{border-bottom:3px solid var(--k-tk)}th.k-cx{border-bottom:3px solid var(--k-cx)}

tbody tr.total:hover td{background:var(--navy)}

tbody tr.total .chip,tbody tr.total .tot{background:rgba(255,255,255,.1);color:#fff}
tbody tr.total .tot.t0{color:#ff9b94}tbody tr.total .tot.t1{color:#ffe08a}tbody tr.total .tot.t10{color:#7ee2b0}tbody tr.total .tot.t20{color:#5eead4}

dialog{max-width:min(860px,calc(100vw - 32px));max-height:86vh;border:0;border-radius:20px;padding:0;background:var(--card);color:var(--ink)}

.dh{display:flex;justify-content:space-between;gap:12px;padding:20px 24px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}

/* Roll call */
.rc{display:inline-block;min-width:46px;padding:2px 8px;border-radius:8px;font-size:12.5px;font-weight:700;background:var(--chip);color:var(--ink)}

.rc-here{background:var(--grn-bg);color:var(--grn)}.rc-late,.rc-hdc{background:var(--yel-bg);color:var(--yel)}
.rc-stf,.rc-rt{background:var(--blu-bg);color:var(--blu)}.rc-t,.rc-f{background:var(--red-bg);color:var(--red)}
.rcb{display:flex;flex-wrap:wrap;gap:4px}
.rcb button{min-width:44px;height:36px;padding:0 10px;border:0;border-radius:10px;background:var(--ground);color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.rcb button:hover{color:var(--ink)}

.rcb button.off-mark.on{background:var(--red);color:#fff}
.rcb .gap{width:10px}

.rcbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:0 22px;font-size:13.5px;color:var(--muted)}

.note{margin:0 22px;padding:10px 14px;border-radius:12px;background:var(--chip);color:var(--muted);font-size:13.5px}
.tag{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11.5px;font-weight:700;background:var(--red-bg);color:var(--red)}
.hid{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:0 22px;font-size:13.5px;color:var(--muted)}

tr.gone td{opacity:.75}
.xsel,input.goal{height:36px;border-radius:10px;border:0;padding:0 8px;background:var(--ground);color:var(--ink);font:inherit;font-size:13.5px;font-weight:600;max-width:180px}
input.goal{width:84px;text-align:right}
.xsel:focus-visible,input.goal:focus-visible{outline:2px solid var(--blu);outline-offset:1px}
tbody tr.total input.goal{background:rgba(255,255,255,.12);color:#fff}
.chg{font-weight:700;color:var(--muted)}.chg.up{color:var(--grn)}.chg.down{color:var(--red)}
tbody tr.total .chg.up{color:#7ee2b0}tbody tr.total .chg.down{color:#ff9b94}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="wrap" id="app"><section class="card"><div class="msg">Loading the Sales Board…</div></section></div>

<dialog id="info"><div class="dh"><div><h3>How this Sales Board is built</h3><p>Where every number comes from and how each one is worked out.</p></div><button class="x" type="button" id="infoX" aria-label="Close">&times;</button></div><div class="db" id="infoBody"></div></dialog>

<script>
(function(){
'use strict';
/* ---------- dates ---------- */
function pad(n){return (n<10?'0':'')+n}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseIso(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function addIso(iso,n){var d=parseIso(iso);d.setDate(d.getDate()+n);return isoOf(d)}
function todayIso(){return isoOf(new Date())}
function daysBetween(a,b){return Math.round((parseIso(b)-parseIso(a))/864e5)}
function md(iso){var d=parseIso(iso);return d?(d.getMonth()+1)+'/'+d.getDate():''}
function mdy(iso){var d=parseIso(iso);return d?(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear():''}
function weekLabel(mon){return 'WE '+md(mon)+' - '+md(addIso(mon,6))}
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
/* ---------- the sheet's number formats ---------- */
function n0(v){return v?Number(v).toLocaleString():''}
function nz(v){return Number(v||0).toLocaleString()}
function d1(v){return typeof v==='number'?v.toFixed(1):(v||'')}
function p1(v){return typeof v==='number'?(v*100).toFixed(1)+'%':(v||'')}
function div(a,b){return b?a/b:'-'}
/* ---------- field status and levels ---------- */
function fieldStatus(start,mon){if(!parseIso(start))return '';var n=Math.floor(daysBetween(start,mon)/7)+1;
  return n<=1?'1st Wk':n===2?'2nd Wk':n===3?'3rd Wk':n===4?'4th Wk':'5th wk+'}
var LEVELS=['Mastermind','Level 3','Level 2','Level 1','Entry Level','In Training'];
var LEADER_LEVELS=['Level 1','Level 2','Level 3','Mastermind'];
function levelOf(role){var p=String(role||'').split(',').map(function(s){return s.trim().toLowerCase()});
  for(var i=0;i<LEVELS.length;i++)if(p.indexOf(LEVELS[i].toLowerCase())>=0)return LEVELS[i];return ''}

/* ---------- raw data, indexed once ---------- */
var D=null, BYDAY={}, HIST={}, TEAMOF={}, ROLEOF={};
function index(d){
  D=d;
  d.knocks.forEach(function(k){var a=BYDAY[k[1]]||(BYDAY[k[1]]=[]);a.push({pk:k[0],c:k[2],tk:k[3],tt:k[4]})});
  d.sales.forEach(function(s){
    HIST[s[1]]=(HIST[s[1]]||0)+s[2]+s[3]+s[4];
    var a=BYDAY[s[1]]||(BYDAY[s[1]]=[]);a.push({pk:s[0],int:s[2],dtv:s[3],nl:s[4],cx:s[5]});
  });
  // A person on two teams counts under the team they lead, else the first (Team Performance's rule).
  var leads={};
  d.teams.forEach(function(t){
    var people=[];if(t.leader)people.push({id:t.leader.id,role:t.leader.role,lead:true});
    t.members.forEach(function(m){people.push({id:m.id,role:m.role,lead:false})});
    people.forEach(function(p){if(!TEAMOF[p.id]||(p.lead&&!leads[p.id])){TEAMOF[p.id]=t.name;ROLEOF[p.id]=p.role}if(p.lead)leads[p.id]=true});
  });
}

/* ---------- the model for one week: one cell per rep per day ---------- */
var MODELS={};
function blankCell(){return{int:0,dtv:0,nl:0,cx:0,tk:0,tt:0}}
function build(mon){
  if(MODELS[mon])return MODELS[mon];
  var weeks=[mon,addIso(mon,-7),addIso(mon,-14)],reps={};
  function rep(pk){return reps[pk]||(reps[pk]={pk:pk,name:'',days:{},clients:{},att:false})}
  for(var day=weeks[2];day<=addIso(mon,6);day=addIso(day,1)){
    (BYDAY[day]||[]).forEach(function(e){
      var r=rep(e.pk),c=r.days[day]||(r.days[day]=blankCell());
      if('tk' in e){c.tk+=e.tk;c.tt+=e.tt;if(e.tk)r.clients[D.clients[e.c]]=1}
      else{c.int+=e.int;c.dtv+=e.dtv;c.nl+=e.nl;c.cx+=e.cx;if(e.int||e.dtv||e.nl||e.cx)r.att=true}
    });
  }
  var rows=Object.keys(reps).filter(function(pk){var r=reps[pk];return Object.keys(r.days).some(function(d){var c=r.days[d];return c.tk||c.tt||c.int||c.dtv||c.nl||c.cx})}).map(function(pk){
    var r=reps[pk],p=D.people[pk]||{};
    r.name=D.names[pk]||D.saleNames[pk]||p.name||('Rep '+pk);
    r.team=TEAMOF[pk]||'';r.level=levelOf(ROLEOF[pk]);
    r.start=p.start||'';r.term=p.term||'';r.email=p.email||'';
    r.fs=fieldStatus(r.start,mon);
    r.termed=!!(r.term&&r.term<=addIso(mon,6));
    var end=r.term&&r.term<todayIso()?r.term:todayIso();
    r.tenure=r.start?Math.max(daysBetween(r.start,end),0):'';
    r.campaign=Object.keys(r.clients).sort().join(', ')||(r.att?'AT&T':'');
    r.wk=weeks.map(function(w){return weekStats(r.days,w)});
    return r;
  }).sort(function(a,b){return a.name.localeCompare(b.name)});
  return MODELS[mon]={mon:mon,weeks:weeks,rows:rows};
}
/* The week as shown: reps who left the board are taken out, and the totals are added up without them
   (the sheet deletes their row, so their numbers leave the totals too). */
function model(mon){
  var B=build(mon),shown=[],gone=[];
  B.rows.forEach(function(r){r.why=goneWhy(r,mon);r.tag=r.why?'':weekTag(r,mon);(r.why?gone:shown).push(r)});
  var tdays={};
  shown.forEach(function(r){Object.keys(r.days).forEach(function(d){var t=tdays[d]||(tdays[d]=blankCell()),c=r.days[d];Object.keys(t).forEach(function(k){t[k]+=c[k]})})});
  return{mon:mon,weeks:B.weeks,rows:shown,gone:gone,total:{name:'TOTALS',days:tdays,wk:B.weeks.map(function(w){return weekStats(tdays,w)})}};
}

/* ---------- roll call (typed here by admins, saved in the board's own store) ----------
   One document per day: rollcall/<YYYY-MM-DD> = {marks: {<OwnerVille id>: code}}.
   No mark + knocks that day = "Here" on its own, shown dashed. T and F take the rep off the board
   from the next week on (T = terminated, F = off the board, the sheet's two rules). */
var ROLL=['Here','Late','H+DC','H+LM','Off','STF','RT','O-NA','FFP','C-RLM','CC-RLM'],OFF_MARKS=['T','F'];
// Not in the field that day (the sheet's rule: STF and RT out, plus days off and terminated).
var NOT_FIELD=['Off','O-NA','FFP','STF','RT','T','F'];
var OFF_NAME={T:'Terminated',F:'Off the board'};
var RC={},RC_DOCS={},OFFS={},DB=null,CANW=null,RC_STATE='loading',RC_ERR='';
function rcClass(code){return 'rc-'+String(code).toLowerCase().replace(/[^a-z]/g,'')}
function rcOf(pk,iso,c){if(ORIG())return null;var m=RC[iso]&&RC[iso][pk];if(m)return{code:m,auto:false};return(c.tk>0||appsOf(c)>0)?{code:'Here',auto:true}:null}
function inField(pk,iso,c){if(ORIG())return c.tk>0||appsOf(c)>0;var x=rcOf(pk,iso,c);return!!x&&NOT_FIELD.indexOf(x.code)<0}
function rcBadge(x){return x?'<span class="rc '+(x.auto?'auto':rcClass(x.code))+'"'+(x.auto?' title="Knocked or sold this day, nobody marked roll call"':'')+'>'+esc(x.code)+'</span>':''}
function indexOffs(){OFFS={};Object.keys(RC).sort().forEach(function(iso){var m=RC[iso];Object.keys(m).forEach(function(pk){
  if(OFF_MARKS.indexOf(m[pk])>=0)(OFFS[pk]||(OFFS[pk]=[])).push({iso:iso,code:m[pk]})})})}
function goneWhy(r,mon){
  if(ORIG())return '';
  if(r.term&&r.term<mon)return 'Terminated '+mdy(r.term)+' in OwnerVille';
  var before=(OFFS[r.pk]||[]).filter(function(o){return o.iso<mon});
  if(!before.length)return '';var o=before[before.length-1];
  return 'Marked '+o.code+' ('+OFF_NAME[o.code]+') on '+DAYS[(parseIso(o.iso).getDay()+6)%7]+' '+md(o.iso);
}
function weekTag(r,mon){
  if(ORIG())return '';
  var sun=addIso(mon,6),o=(OFFS[r.pk]||[]).filter(function(x){return x.iso>=mon&&x.iso<=sun});
  if(o.length)return o[o.length-1].code;
  return r.term&&r.term<=sun?'T':'';
}
var WQ={};
function writeMark(iso,pk,code){
  var day=RC[iso]||(RC[iso]={});
  if(code)day[pk]=code;else delete day[pk];
  indexOffs();paint();
  WQ[iso]=(WQ[iso]||Promise.resolve()).then(function(){
    var ref=DB.doc('rollcall/'+iso),m={},at=new Date().toISOString();m[pk]=code||null;
    if(RC_DOCS[iso])return ref.update({marks:m,at:at});
    var all={};Object.keys(day).forEach(function(k){all[k]=day[k]});
    return ref.set({marks:all,at:at}).then(function(){RC_DOCS[iso]=true});
  }).catch(function(e){
    if(e&&e.code==='invalid_argument'&&CANW!==true)CANW=false;
    RC_ERR='Roll call did not save'+(e&&e.code==='quota_exceeded'?' (the board’s store is full)':'')+'. Try again in a moment.';paint();
  });
}
function startRollCall(){
  if(!window.claude||!window.claude.use){RC_STATE='none';return}
  var timer=setTimeout(function(){if(RC_STATE==='loading'){RC_STATE='slow';paint()}},10000);
  window.claude.use('user').then(function(u){if(u)u.canEdit().then(function(v){CANW=v;paint()})});
  window.claude.use('db').then(function(db){
    if(!db){clearTimeout(timer);RC_STATE='none';paint();return}
    DB=db;
    db.collection('newstarts').onSnapshot(function(snap){var o={};snap.docs.forEach(function(d){o[d.id]=d.data()||{}});NEWS=o;paint()},function(){});
    db.doc('meta/sync').onSnapshot(function(snap){SYNC_AT=snap.exists&&(snap.data()||{}).at||'';paint()},function(){});
    db.doc('meta/profiles').onSnapshot(function(snap){PROF_DOC=snap.exists;var sd=snap.exists&&snap.data()||{},reps=withNames(sd.reps,sd.byName),o={};
      Object.keys(reps).forEach(function(pk){var p=reps[pk]||{},q={};Object.keys(p).forEach(function(k){if(p[k])q[k]=String(p[k])});o[pk]=q});PROF=o;paint()},function(){});
    db.doc('meta/goals').onSnapshot(function(snap){GOALS_DOC=snap.exists;var d=snap.exists&&snap.data()||{},t={};
      Object.keys(d.teams||{}).forEach(function(k){if(d.teams[k]!=null)t[k]=d.teams[k]});GOALS={office:d.office==null?null:d.office,teams:t};paint()},function(){});
    db.collection('rollcall').onSnapshot(function(snap){
      var next={},docs={};
      snap.docs.forEach(function(d){docs[d.id]=true;var dd=d.data()||{},m=withNames(dd.marks,dd.byName),o={};Object.keys(m).forEach(function(k){if(m[k])o[k]=String(m[k])});next[d.id]=o});
      RC=next;RC_DOCS=docs;indexOffs();
      if(!snap.metadata.fromCache){clearTimeout(timer);RC_STATE='live'}
      paint();
    },function(e){clearTimeout(timer);RC_STATE='error';RC_ERR='Roll call could not load ('+(e&&e.code||'error')+'). Reload the page.';paint()});
  });
}
function cellOf(days,iso){return days[iso]||blankCell()}
function appsOf(c){return c.int+c.dtv+c.nl}
function weekStats(days,mon){
  var s={apps:0,int:0,dtv:0,nl:0,tk:0,tt:0,cx:0,worked:0,any:false};
  for(var i=0;i<7;i++){var c=cellOf(days,addIso(mon,i)),a=appsOf(c);
    s.apps+=a;s.int+=c.int;s.dtv+=c.dtv;s.nl+=c.nl;s.tk+=c.tk;s.tt+=c.tt;s.cx+=c.cx;
    if(i<6&&(c.tk>0||a!==0))s.worked++;
    if(c.tk>0||a>0)s.any=true}
  s.avgK=s.tk?div(s.tk,s.worked):'';s.avgT=s.tk?div(s.tt,s.worked):'';
  s.pct=s.tk?s.tt/s.tk:'';s.perApp=s.tk?div(s.tt,s.apps):'';
  return s;
}
function dayPct(c){return(!c.tk&&!c.tt)?'':(c.tk?c.tt/c.tk:'-')}
function dayAppTT(c){return(!c.tk&&!c.tt)?'':(c.tt?appsOf(c)/c.tt:'-')}

/* ---------- board stats ---------- */
function boardStats(M){
  var out={week:{field:0,board:0},days:[]};for(var i=0;i<7;i++)out.days.push({field:0,board:0});
  M.rows.forEach(function(r){
    if(r.fs==='1st Wk')return;
    var any=false;
    for(var i=0;i<7;i++){var iso=addIso(M.mon,i),c=cellOf(r.days,iso),a=appsOf(c);if(inField(r.pk,iso,c)){any=true;out.days[i].field++;if(a>0)out.days[i].board++}}
    if(any){out.week.field++;if(r.wk[0].apps>0)out.week.board++}
  });
  var tw=M.total.wk[0];finish(out.week,tw.int,tw.apps);
  out.days.forEach(function(s,i){var c=cellOf(M.total.days,addIso(M.mon,i));finish(s,c.int,appsOf(c))});
  return out;
}
function finish(s,int,apps){s.zero=s.field-s.board;s.pct=s.field?s.board/s.field:0;s.intPer=s.field?int/s.field:0;s.appsPer=s.field?apps/s.field:0}

/* ---------- team summary ---------- */
function teamSummary(M){
  var g={},order=[];
  M.rows.forEach(function(r){var t=r.team||'No team';if(!g[t]){g[t]=[];order.push(t)}g[t].push(r)});
  order.sort(function(a,b){return(a==='No team')-(b==='No team')||a.localeCompare(b)});
  return{rows:order.map(function(t){return teamRow(t,g[t],M)}),total:teamRow('All teams',M.rows,M)};
}
function teamRow(name,reps,M){
  var row={name:name,wk:[],days:[],n:reps.length};
  M.weeks.forEach(function(w,wi){
    var s={units:0,int:0,dtv:0,nl:0,tk:0,tt:0,cx:0,worked:0};
    reps.forEach(function(r){var x=r.wk[wi];s.int+=x.int;s.dtv+=x.dtv;s.nl+=x.nl;s.tk+=x.tk;s.tt+=x.tt;s.cx+=x.cx;s.worked+=x.worked});
    s.units=s.int+s.dtv+s.nl;s.avgK=s.tk?div(s.tk,s.worked):'';s.avgT=s.tk?div(s.tt,s.worked):'';s.pct=s.tk?s.tt/s.tk:'';s.perUnit=s.tk?div(s.tt,s.units):'';
    row.wk.push(s);
  });
  for(var i=0;i<7;i++){var d={units:0,int:0,dtv:0,nl:0,tk:0,tt:0},iso=addIso(M.mon,i);
    reps.forEach(function(r){var c=cellOf(r.days,iso);d.int+=c.int;d.dtv+=c.dtv;d.nl+=c.nl;d.tk+=c.tk;d.tt+=c.tt});
    d.units=d.int+d.dtv+d.nl;d.pct=(!d.tk&&!d.tt)?'':(d.tk?d.tt/d.tk:'-');d.perTT=(!d.tk&&!d.tt)?'':(d.tt?d.units/d.tt:'-');row.days.push(d)}
  row.entry=reps.filter(function(r){return r.level==='Entry Level'}).length;
  row.leaders=reps.filter(function(r){return LEADER_LEVELS.indexOf(r.level)>=0}).length;
  row.active=reps.filter(function(r){return r.wk[0].apps>0&&!r.termed&&r.fs!=='1st Wk'}).length;
  row.unitsAvg=row.active?row.wk[0].units/row.active:'-';row.intAvg=row.active?row.wk[0].int/row.active:'-';
  row.lwUnitsAvg=row.active?row.wk[1].units/row.active:'-';row.lwIntAvg=row.active?row.wk[1].int/row.active:'-';
  return row;
}

/* ---------- table ---------- */
function table(groups,rows,total,opts){
  opts=opts||{};
  var grp='<tr class="grow"><th class="n"></th><th class="name"></th>'+groups.map(function(g){
    var lab=g.tone==='day'?'<button type="button" class="daybtn" data-day="'+g.dayIdx+'" title="'+(g.open?'Collapse':'Expand')+' this day">'+esc(g.label)+'<span class="ar">'+(g.open?'◀':'▶')+'</span></button>':'<span class="glabel">'+esc(g.label)+'</span>';
    return '<th colspan="'+g.cols.length+'">'+lab+'</th>'}).join('')+'</tr>';
  var cols='<tr class="crow"><th class="n" data-sort>#</th><th class="name left" data-sort>'+esc(opts.nameHead||'Rep')+'</th>'+groups.map(function(g){
    return g.cols.map(function(c,ci){return '<th class="k-'+(c.k||'plain')+(ci===0?' sep':'')+(c.left?' left':'')+'" data-sort'+(c.title?' title="'+esc(c.title)+'"':'')+'>'+esc(c.h)+'</th>'}).join('')}).join('')+'</tr>';
  function line(r,n,isTotal,cls){
    var who=isTotal?'<span class="who">'+esc(opts.totalLabel||r.name)+'</span>'
      :(r.pk?'<span class="dot '+fsCls(r.fs)+'" title="'+esc(r.fs||'No start date')+'"></span>':'')+'<span class="who">'+esc(r.name)+'</span>'+(opts.sub?opts.sub(r):'');
    return '<tr class="'+(isTotal?'total':'')+(cls?' '+cls:'')+'"><td class="n">'+n+'</td><td class="name"><div class="nw">'+who+'</div></td>'+
      groups.map(function(g){return g.cols.map(function(c,ci){
        var html,k=[ci===0?'sep':''];
        if(g.tone==='plain'){html=(!isTotal||opts.plainTotal)&&c.v?c.v(r):'';if(c.left)k.push('left')}
        else{var raw=g.value(r,c);html=c.fmt(raw);
          if(c.k==='apps'&&!c.rw&&(g.tone==='cur'||g.tone==='day')&&html!=='')html='<span class="'+(g.tone==='cur'?'tot '+totalCls(raw):'chip '+(isTotal||opts.noScale?'':scale(raw)))+'">'+html+'</span>';
          else if(g.tone!=='cur'&&c.k==='apps')k.push('soft');
          else if(!isTotal&&g.tone==='day'&&(raw===0||(c.k==='cx'&&raw>0)))k.push('red')}
        var cl=k.join(' ').trim();return '<td'+(cl?' class="'+cl+'"':'')+'>'+html+'</td>'}).join('')}).join('')+'</tr>';
  }
  var body=rows.map(function(r,i){return line(r,i+1,false,opts.rowCls?opts.rowCls(r):'')}).join('')+(total?line(total,'',true):'');
  return '<div class="scroll"><table><thead>'+grp+cols+'</thead><tbody>'+body+'</tbody></table></div>';
}
function weekGroup(label,wi,tone,cols){return{label:label,tone:tone,cols:cols||WEEK_COLS,value:function(r,c){return c.rw?c.raw(r):c.raw(r.wk[wi])}}}
/* Apps this week against last week and against the week before: up or down, in %. */
function change(a,b){if(!a&&!b)return '';if(!b)return 'new';return(a-b)/b}
function fmtChange(v){if(v==='')return '';if(v==='new')return '<span class="chg up" title="No apps the week compared">new</span>';
  var p=Math.round(v*100);if(p===0)return '<span class="chg">0%</span>';
  return '<span class="chg '+(p>0?'up':'down')+'">'+(p>0?'▲ ':'▼ ')+Math.abs(p)+'%</span>'}
/* Same stretch of days on both sides: while this week is still going, Monday to the day the data was pulled,
   against Monday to the same weekday of the week compared. A finished week compares whole weeks. */
function daysSoFar(mon){if(mon!==D.thisMon)return 7;var g=parseIso(D.generatedAt.slice(0,10));return Math.min(7,Math.max(1,daysBetween(mon,isoOf(new Date(D.generatedAt)))+1))}
function appsFirst(days,mon,n){var t=0;for(var i=0;i<n;i++)t+=appsOf(cellOf(days,addIso(mon,i)));return t}
function changeVs(r,back){var M=CUR_M,n=daysSoFar(M.mon);return change(appsFirst(r.days,M.mon,n),appsFirst(r.days,addIso(M.mon,-7*back),n))}
function spanLabel(){var n=daysSoFar(CUR_M.mon);return n===7?'':' · Mon–'+DAYS[n-1]}
var CHANGE_COLS=[
  {k:'apps',h:'Apps vs last week',title:'Apps from Monday to the same weekday, this week against last week, up or down in %.',rw:true,raw:function(r){return changeVs(r,1)},fmt:fmtChange},
  {k:'apps',h:'Apps vs prior week',title:'Apps from Monday to the same weekday, this week against the week before last, up or down in %.',rw:true,raw:function(r){return changeVs(r,2)},fmt:fmtChange}];
function dayLabel(mon,i){return DAYS[i].toUpperCase()+' '+parseIso(addIso(mon,i)).getDate()}
function dayOpen(i){if(ORIG())return true;return st.open[i]==null?!st.compact:st.open[i]}
function dayGroups(mon,full,compact){return DAYS.map(function(d,i){var iso=addIso(mon,i),o=dayOpen(i);
  return{label:dayLabel(mon,i),tone:'day',dayIdx:i,open:o,cols:o?full:compact,value:function(r,c){var cell=cellOf(r.days,iso);return c.rc?(r.pk?rcOf(r.pk,iso,cell):null):c.raw(cell)}}})}
function fsSub(r){return (r.tag?'<span class="tag" title="'+esc(OFF_NAME[r.tag])+' this week: off the board from next week">'+esc(r.tag)+'</span>':'')+(r.fs?'<span class="fs">'+esc(r.fs)+'</span>':'')}
function repTable(M,view){

function sortVal(td){var sel=td.querySelector&&td.querySelector('select,input');var t=(sel?sel.value:(td.textContent||'')).replace(/ /g,' ').trim();t=t.replace(/^▲ new$/,'99999').replace(/^▲ /,'').replace(/^▼ /,'-');if(!t||t==='-'||t==='—')return null;
  if(/^-?[\d,]*\.?\d+%?$/.test(t))return parseFloat(t.replace(/[,%]/g,''));
  var m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(t);if(m)return +m[3]*1e4+ +m[1]*100+ +m[2];return t.toLowerCase()}
function sortBy(th){
  var row=th.parentNode,tb=th.closest('table').tBodies[0],idx=[].indexOf.call(row.children,th);
  var rows=[].slice.call(tb.rows).filter(function(r){return!r.classList.contains('total')}),tot=[].slice.call(tb.rows).filter(function(r){return r.classList.contains('total')});
  var vals=rows.map(function(r){return sortVal(r.cells[idx])}),isText=vals.some(function(v){return typeof v==='string'});
  var dir=th.dataset.dir?-Number(th.dataset.dir):(isText||idx===0?1:-1);
  row.querySelectorAll('th[data-dir]').forEach(function(x){delete x.dataset.dir;x.textContent=x.textContent.replace(/ [▲▼]$/,'')});
  th.dataset.dir=dir;th.textContent+=dir===1?' ▲':' ▼';
  rows.map(function(r,i){return{r:r,v:vals[i],i:i}}).sort(function(a,b){if(a.v==null&&b.v==null)return a.i-b.i;if(a.v==null)return 1;if(b.v==null)return-1;
    if(typeof a.v!==typeof b.v)return typeof a.v==='number'?-1:1;return(a.v<b.v?-1:a.v>b.v?1:a.i-b.i)*dir}).forEach(function(x){tb.appendChild(x.r)});
  tot.forEach(function(r){tb.appendChild(r)});
}

  var sub={board:ORIG()?'Monday to Sunday, as on OwnerVille. Click a column to sort.':'Days start compact (apps, knocks, talk-tos). Click a day to open all its columns, roll call included. Click a column to sort.',week:"This week's totals, the sheet's running week columns.",weeks:'This week, last week and the week before, side by side.',profile:'Start dates and status from OwnerVille; team and level from the team builder.'}[st.view];
  app.innerHTML='<div class="top">'+pills('view',VIEWS_NOW,st.view)+'<div class="ctrl">'+pills('ver',[['ours','Our version'],['orig','OwnerVille original']],ORIG()?'orig':'ours')+'<span class="stamp">'+esc(stamp())+'</span>'+
    (ORIG()?'<select id="week" aria-label="Week">'+origWeekOptions()+'</select>':'<select id="month" aria-label="Month">'+monthOptions()+'</select><select id="week" aria-label="Weekending">'+weekOptions()+'</select>')+'<button type="button" class="btn" id="infoBtn"><span class="i" aria-hidden="true">i</span>How it’s built</button></div></div>'+
    banner(M)+errs+
    (st.view==='roll'?rollCard(M):st.view==='new'?newStartsCard(M):
    card('Reps',sub,(st.view==='board'?dayToggle:'')+LEGEND,(M.rows.length?repTable(M,st.view):'<div class="msg">No knocks, sales or cancels in '+esc(weekLabel(M.mon))+' or the two weeks before.</div>')+(ORIG()?'':goneLine(M))))+
    '<div class="two">'+card('Board stats','Reps past their 1st week.','',statsTable(M))+card('Recent weeks','Apps by day, the six weeks before.','',historyTable(M))+'</div>'+
    card('Teams','From the OwnerVille team builder.',(st.teamView==='days'?dayToggle:'')+pills('tview',TEAM_VIEWS,st.teamView),teamTable(M,st.teamView));
  window.scrollTo(x,y);
}
document.addEventListener('click',function(e){
  var t=e.target;if(!t.closest)return;
  var b;
  if((b=t.closest('.ver button'))){st.orig=b.dataset.v==='orig';store('orig',st.orig?'1':'0');st.open={};paint();return}
  if((b=t.closest('.view button'))){st.view=b.dataset.v;store('view',st.view);paint();return}
  if((b=t.closest('.tview button'))){st.teamView=b.dataset.v;paint();return}
  if((b=t.closest('.days button'))){st.compact=b.dataset.v==='compact';st.open={};store('compact',st.compact?'1':'0');paint();return}
  if((b=t.closest('.daybtn'))){var i=+b.dataset.day;st.open[i]=!dayOpen(i);paint();return}
  if((b=t.closest('.rcday button'))){st.rcDay=+b.dataset.v;RC_ERR='';paint();return}
  if((b=t.closest('.rcb button'))){var iso=addIso(st.mon,st.rcDay),cur=RC[iso]&&RC[iso][b.dataset.pk];RC_ERR='';
    writeMark(iso,b.dataset.pk,cur===b.dataset.code?null:b.dataset.code);return}
  if(t.closest('#goneBtn')){st.showGone=!st.showGone;paint();return}
  if((b=t.closest('[data-back]'))){var pk=b.dataset.back;(OFFS[pk]||[]).filter(function(o){return o.iso<st.mon}).forEach(function(o){writeMark(o.iso,pk,null)});return}
  if(t.closest('#infoBtn')){document.getElementById('info').showModal();return}
  if(t.closest('#infoX')){document.getElementById('info').close();return}
  if((b=t.closest('th[data-sort]')))sortBy(b);
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.classList&&el.classList.contains('xsel')){RC_ERR='';writeExtra(el.dataset.pk,el.dataset.k,el.value);return}
  if(el.classList&&el.classList.contains('goal')){var n=el.value===''?null:Math.max(0,Math.round(+el.value));RC_ERR='';writeGoal(el.dataset.team||'',isNaN(n)?null:n);return}
  if(e.target.id==='week'){st.mon=e.target.value;st.open={};st.rcDay=null;paint()}
  if(e.target.id==='month'){var k=e.target.value;st.mon=allWeeks().filter(function(w){return monthOf(w)===k})[0];st.open={};st.rcDay=null;paint()}
});
document.getElementById('info').addEventListener('click',function(e){if(e.target.id==='info')e.target.close()});
