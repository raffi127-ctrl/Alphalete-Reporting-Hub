<title>Sales Board (versión vieja)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: navy command banner, then white cards; one wide rep table with pinned names, days collapsible. */
:root{
  --ground:#e7eef1; --card:#ffffff; --zebra:#f7fafb; --hover:#eef4f6;
  --ink:#0a2f3c; --muted:#526b78; --faint:#7d939d; --line:rgba(10,47,60,.10);
  --navy:#0a2f3c; --on-navy:#ffffff; --on-navy-soft:rgba(255,255,255,.7);
  --chip:#eef3f5;
  --red-bg:#fbe1de; --red:#b42318; --yel-bg:#fbeac6; --yel:#875400;
  --grn-bg:#d6f1e5; --grn:#0c6a45; --blu-bg:#dbe6fb; --blu:#2450b8; --cya-bg:#d2f1f7; --cya:#0e6f86;
  --k-apps:#0a2f3c; --k-int:#660000; --k-intup:#783f04; --k-dtv:#20124d; --k-nl:#073763; --k-tk:#274e13; --k-cx:#bf9000;
  --font:"Urbanist",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0b1a20; --card:#11252d; --zebra:#142c35; --hover:#18343e;
  --ink:#e4eef2; --muted:#9db2bb; --faint:#7e959f; --line:rgba(228,238,242,.10);
  --navy:#06212b; --chip:#1b3640;
  --red-bg:#4a1d1a; --red:#ff9b94; --yel-bg:#47370f; --yel:#ffd76e; --grn-bg:#123d2c; --grn:#7ee2b0; --blu-bg:#1b2d55; --blu:#9cb8ff; --cya-bg:#0f3a44; --cya:#5eead4;
  --k-apps:#7fb2c4; --k-int:#e07a7a; --k-intup:#d99a5b; --k-dtv:#a493e0; --k-nl:#6fa8dc; --k-tk:#8bc27a; --k-cx:#e6c35c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0b1a20; --card:#11252d; --zebra:#142c35; --hover:#18343e;
  --ink:#e4eef2; --muted:#9db2bb; --faint:#7e959f; --line:rgba(228,238,242,.10);
  --navy:#06212b; --chip:#1b3640;
  --red-bg:#4a1d1a; --red:#ff9b94; --yel-bg:#47370f; --yel:#ffd76e; --grn-bg:#123d2c; --grn:#7ee2b0; --blu-bg:#1b2d55; --blu:#9cb8ff; --cya-bg:#0f3a44; --cya:#5eead4;
  --k-apps:#7fb2c4; --k-int:#e07a7a; --k-intup:#d99a5b; --k-dtv:#a493e0; --k-nl:#6fa8dc; --k-tk:#8bc27a; --k-cx:#e6c35c;
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-weight:500;-webkit-font-smoothing:antialiased}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1800px;margin:0 auto;padding-block:18px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,select{font-family:inherit}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.pills{display:inline-flex;flex-wrap:wrap;gap:2px;padding:4px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.pills button{height:36px;padding:0 16px;border:0;border-radius:999px;background:transparent;font-size:14.5px;font-weight:600;color:var(--muted);cursor:pointer}
.pills button:hover{color:var(--ink)}
.pills button.on{background:var(--navy);color:var(--on-navy)}
.pills button:focus-visible,.btn:focus-visible,select:focus-visible,.daybtn:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.ctrl select{height:40px;border-radius:999px;border:0;padding:0 14px;background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);font-size:14.5px;font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.btn:hover{color:var(--ink)}
.btn .i{display:inline-block;width:24px;height:24px;border-radius:999px;background:var(--ground);color:var(--ink);font:italic 700 14px/24px Georgia,serif;text-align:center}
.stamp{font-size:13px;color:var(--muted)}
.banner{background:var(--navy);color:var(--on-navy);border-radius:24px;padding:22px 26px;display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;justify-content:space-between}
.kicker{font-size:14px;color:var(--on-navy-soft)}
.banner h1{margin:0;font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.banner p{margin:2px 0 0;font-size:15px;color:var(--on-navy-soft)}
.bstats{display:flex;flex-wrap:wrap;gap:10px}
.bstat{background:rgba(255,255,255,.07);border-radius:14px;padding:10px 14px;min-width:120px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.bstat span{display:block;font-size:13px;color:var(--on-navy-soft)}
.bstat b{display:block;font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.bstat b.teal{color:#5eead4}.bstat b.lav{color:#c3bef7}
.bstat em{display:block;font-style:normal;font-size:12.5px;color:rgba(255,255,255,.6)}
.card{background:var(--card);border-radius:20px;padding:18px 0 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(560px,100%),1fr));gap:16px;min-width:0}
.head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 16px;padding:0 22px}
.head h2{margin:0;font-size:22px;font-weight:600;line-height:1.2}
.head p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.headr{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px;color:var(--muted)}
.legend .chip{min-width:0;padding:2px 9px;font-size:12.5px}
.scroll{overflow:auto;max-height:76vh;min-width:0}
table{border-collapse:separate;border-spacing:0;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink)}
table.small{width:100%}
th,td{padding:9px 8px;text-align:center;background:var(--card);vertical-align:middle}
th:first-child,td:first-child{padding-left:22px}
th:last-child,td:last-child{padding-right:22px}
thead th{position:sticky;z-index:2}
tr.grow th{top:0;height:42px;padding:6px;text-align:left}
tr.crow th{top:42px;font-size:12px;font-weight:600;color:var(--muted);padding:8px 8px 6px;border-bottom:1px solid var(--line);white-space:normal;line-height:1.2;vertical-align:bottom;min-width:46px;max-width:96px;cursor:pointer;user-select:none}
table.small tr.crow th{top:0;cursor:default;max-width:none}
tr.crow th:hover{color:var(--ink)}
th.k-apps{border-bottom:3px solid var(--k-apps)}th.k-int{border-bottom:3px solid var(--k-int)}th.k-intup{border-bottom:3px solid var(--k-intup)}
th.k-dtv{border-bottom:3px solid var(--k-dtv)}th.k-nl{border-bottom:3px solid var(--k-nl)}th.k-tk{border-bottom:3px solid var(--k-tk)}th.k-cx{border-bottom:3px solid var(--k-cx)}
.daybtn{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:0;background:var(--navy);color:var(--on-navy);font-size:13px;font-weight:600;letter-spacing:.02em;cursor:pointer}
.daybtn .ar{font-size:10px;opacity:.7}
.glabel{font-size:12px;font-weight:600;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;padding:0 4px}
.n{position:sticky;left:0;z-index:3;min-width:58px;max-width:58px;color:var(--faint);font-weight:600;text-align:left}
.name{position:sticky;left:58px;z-index:3;min-width:230px;text-align:left;box-shadow:6px 0 8px -6px rgba(10,47,60,.18)}
thead .n,thead .name{z-index:4}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:hover td{background:var(--hover)}
.nw{display:flex;align-items:center;gap:8px}
.who{font-weight:600;font-size:15px}
.fs{font-size:12px;color:var(--faint)}
.dot{width:10px;height:10px;border-radius:999px;flex:none;background:#dbe7ec;display:inline-block}
.fs1{background:#b4a7d6}.fs2{background:#f1c232}.fs3{background:#6fa8dc}.fs4{background:#b45f06}.fs5{background:#6aa84f}
.sep{border-left:1px solid var(--line)}
.left{text-align:left!important}
.chip{display:inline-block;min-width:28px;padding:3px 8px;border-radius:8px;font-weight:700;background:var(--chip)}
.tot{display:inline-block;min-width:44px;padding:4px 10px;border-radius:10px;font-weight:700;font-size:16px;background:var(--chip)}
.s0,.t0{background:var(--red-bg);color:var(--red)}
.s1,.t1{background:var(--yel-bg);color:var(--yel)}
.s3,.t10{background:var(--grn-bg);color:var(--grn)}
.s5{background:var(--blu-bg);color:var(--blu)}
.t20{background:var(--cya-bg);color:var(--cya)}
td.red{color:var(--red);font-weight:700}
td.soft{color:var(--muted);font-weight:600}
td.strong{font-weight:600}
.na{color:var(--faint);cursor:help}
tbody tr.total td{background:var(--navy);color:var(--on-navy);font-weight:600;padding:11px 8px;position:sticky;bottom:0;z-index:2}
tbody tr.total td.n,tbody tr.total td.name{z-index:4}
tbody tr.total td:first-child{padding-left:22px}
tbody tr.total:hover td{background:var(--navy)}
tbody tr.total td.soft{color:#c9d6dc}
tbody tr.total .chip,tbody tr.total .tot{background:rgba(255,255,255,.1);color:#fff}
tbody tr.total .tot.t0{color:#ff9b94}tbody tr.total .tot.t1{color:#ffe08a}tbody tr.total .tot.t10{color:#7ee2b0}tbody tr.total .tot.t20{color:#5eead4}
tbody tr.noteam .who{font-style:italic;font-weight:500}
.msg{padding:28px;text-align:center;color:var(--muted)}
.err{padding:12px 16px;border-radius:14px;background:var(--red-bg);color:var(--red);font-size:14px}
dialog{max-width:min(860px,calc(100vw - 32px));max-height:86vh;border:0;border-radius:20px;padding:0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(5,20,26,.55)}
.dh{display:flex;justify-content:space-between;gap:12px;padding:20px 24px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.dh h3{margin:0;font-size:20px}.dh p{margin:2px 0 0;color:var(--muted);font-size:14px}
.db{padding:8px 24px 24px;font-size:14.5px}
.db h4{margin:18px 0 6px;font-size:15px}
.db dt{font-weight:700;margin-top:8px}.db dd{margin:2px 0 0;color:var(--muted);max-width:72ch}
.db p,.db li{color:var(--muted);max-width:72ch}
.x{border:0;background:var(--ground);color:var(--ink);width:36px;height:36px;border-radius:999px;font-size:20px;cursor:pointer;flex:none}
@media (max-width:640px){.banner{padding:18px}.banner h1{font-size:24px}.name{min-width:170px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"><section class="card"><div class="msg">Loading the Sales Board…</div></section></div>

<dialog id="info"><div class="dh"><div><h3>How this Sales Board is built</h3><p>Where every number comes from and how each one is worked out.</p></div><button class="x" type="button" id="infoX" aria-label="Close">&times;</button></div><div class="db" id="infoBody"></div></dialog>

<script>
(function(){
'use strict';
/* ---------- dates ---------- */
function pad(n){return (n<10?'0':'')+n}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseIso(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function addIso(iso,n){var d=parseIso(iso);d.setDate(d.getDate()+n);return isoOf(d)}
function todayIso(){return isoOf(new Date())}
function daysBetween(a,b){return Math.round((parseIso(b)-parseIso(a))/864e5)}
function md(iso){var d=parseIso(iso);return d?(d.getMonth()+1)+'/'+d.getDate():''}
function mdy(iso){var d=parseIso(iso);return d?(d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear():''}
function weekLabel(mon){return 'WE '+md(mon)+' - '+md(addIso(mon,6))}
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
/* ---------- the sheet's number formats ---------- */
function n0(v){return v?Number(v).toLocaleString():''}
function nz(v){return Number(v||0).toLocaleString()}
function d1(v){return typeof v==='number'?v.toFixed(1):(v||'')}
function p1(v){return typeof v==='number'?(v*100).toFixed(1)+'%':(v||'')}
function div(a,b){return b?a/b:'-'}
/* ---------- field status and levels ---------- */
function fieldStatus(start,mon){if(!parseIso(start))return '';var n=Math.floor(daysBetween(start,mon)/7)+1;
  return n<=1?'1st Wk':n===2?'2nd Wk':n===3?'3rd Wk':n===4?'4th Wk':'5th wk+'}
var LEVELS=['Mastermind','Level 3','Level 2','Level 1','Entry Level','In Training'];
var LEADER_LEVELS=['Level 1','Level 2','Level 3','Mastermind'];
function levelOf(role){var p=String(role||'').split(',').map(function(s){return s.trim().toLowerCase()});
  for(var i=0;i<LEVELS.length;i++)if(p.indexOf(LEVELS[i].toLowerCase())>=0)return LEVELS[i];return ''}

/* ---------- raw data, indexed once ---------- */
var D=null, BYDAY={}, HIST={}, TEAMOF={}, ROLEOF={};
function index(d){
  D=d;
  d.knocks.forEach(function(k){var a=BYDAY[k[1]]||(BYDAY[k[1]]=[]);a.push({pk:k[0],c:k[2],tk:k[3],tt:k[4]})});
  d.sales.forEach(function(s){
    HIST[s[1]]=(HIST[s[1]]||0)+s[2]+s[3]+s[4];
    var a=BYDAY[s[1]]||(BYDAY[s[1]]=[]);a.push({pk:s[0],int:s[2],dtv:s[3],nl:s[4],cx:s[5]});
  });
  // A person on two teams counts under the team they lead, else the first (Team Performance's rule).
  var leads={};
  d.teams.forEach(function(t){
    var people=[];if(t.leader)people.push({id:t.leader.id,role:t.leader.role,lead:true});
    t.members.forEach(function(m){people.push({id:m.id,role:m.role,lead:false})});
    people.forEach(function(p){if(!TEAMOF[p.id]||(p.lead&&!leads[p.id])){TEAMOF[p.id]=t.name;ROLEOF[p.id]=p.role}if(p.lead)leads[p.id]=true});
  });
}

/* ---------- the model for one week: one cell per rep per day ---------- */
var MODELS={};
function blankCell(){return{int:0,dtv:0,nl:0,cx:0,tk:0,tt:0}}
function build(mon){
  if(MODELS[mon])return MODELS[mon];
  var weeks=[mon,addIso(mon,-7),addIso(mon,-14)],reps={};
  function rep(pk){return reps[pk]||(reps[pk]={pk:pk,name:'',days:{},clients:{},att:false})}
  for(var day=weeks[2];day<=addIso(mon,6);day=addIso(day,1)){
    (BYDAY[day]||[]).forEach(function(e){
      var r=rep(e.pk),c=r.days[day]||(r.days[day]=blankCell());
      if('tk' in e){c.tk+=e.tk;c.tt+=e.tt;if(e.tk)r.clients[D.clients[e.c]]=1}
      else{c.int+=e.int;c.dtv+=e.dtv;c.nl+=e.nl;c.cx+=e.cx;if(e.int||e.dtv||e.nl||e.cx)r.att=true}
    });
  }
  var rows=Object.keys(reps).filter(function(pk){var r=reps[pk];return Object.keys(r.days).some(function(d){var c=r.days[d];return c.tk||c.tt||c.int||c.dtv||c.nl||c.cx})}).map(function(pk){
    var r=reps[pk],p=D.people[pk]||{};
    r.name=D.names[pk]||D.saleNames[pk]||p.name||('Rep '+pk);
    r.team=TEAMOF[pk]||'';r.level=levelOf(ROLEOF[pk]);
    r.start=p.start||'';r.term=p.term||'';r.email=p.email||'';
    r.fs=fieldStatus(r.start,mon);
    r.termed=!!(r.term&&r.term<=addIso(mon,6));
    var end=r.term&&r.term<todayIso()?r.term:todayIso();
    r.tenure=r.start?Math.max(daysBetween(r.start,end),0):'';
    r.campaign=Object.keys(r.clients).sort().join(', ')||(r.att?'AT&T':'');
    r.wk=weeks.map(function(w){return weekStats(r.days,w)});
    return r;
  }).sort(function(a,b){return a.name.localeCompare(b.name)});
  var tdays={};
  rows.forEach(function(r){Object.keys(r.days).forEach(function(d){var t=tdays[d]||(tdays[d]=blankCell()),c=r.days[d];Object.keys(t).forEach(function(k){t[k]+=c[k]})})});
  var M={mon:mon,weeks:weeks,rows:rows,total:{name:'TOTALS',days:tdays,wk:weeks.map(function(w){return weekStats(tdays,w)})}};
  return MODELS[mon]=M;
}
function cellOf(days,iso){return days[iso]||blankCell()}
function appsOf(c){return c.int+c.dtv+c.nl}
function weekStats(days,mon){
  var s={apps:0,int:0,dtv:0,nl:0,tk:0,tt:0,cx:0,worked:0,any:false};
  for(var i=0;i<7;i++){var c=cellOf(days,addIso(mon,i)),a=appsOf(c);
    s.apps+=a;s.int+=c.int;s.dtv+=c.dtv;s.nl+=c.nl;s.tk+=c.tk;s.tt+=c.tt;s.cx+=c.cx;
    if(i<6&&(c.tk>0||a!==0))s.worked++;
    if(c.tk>0||a>0)s.any=true}
  s.avgK=s.tk?div(s.tk,s.worked):'';s.avgT=s.tk?div(s.tt,s.worked):'';
  s.pct=s.tk?s.tt/s.tk:'';s.perApp=s.tk?div(s.tt,s.apps):'';
  return s;
}
function dayPct(c){return(!c.tk&&!c.tt)?'':(c.tk?c.tt/c.tk:'-')}
function dayAppTT(c){return(!c.tk&&!c.tt)?'':(c.tt?appsOf(c)/c.tt:'-')}

/* ---------- board stats ---------- */
function boardStats(M){
  var out={week:{field:0,board:0},days:[]};for(var i=0;i<7;i++)out.days.push({field:0,board:0});
  M.rows.forEach(function(r){
    if(r.fs==='1st Wk')return;
    var w=r.wk[0];if(w.any){out.week.field++;if(w.apps>0)out.week.board++}
    for(var i=0;i<7;i++){var c=cellOf(r.days,addIso(M.mon,i)),a=appsOf(c);if(c.tk>0||a>0){out.days[i].field++;if(a>0)out.days[i].board++}}
  });
  var tw=M.total.wk[0];finish(out.week,tw.int,tw.apps);
  out.days.forEach(function(s,i){var c=cellOf(M.total.days,addIso(M.mon,i));finish(s,c.int,appsOf(c))});
  return out;
}
function finish(s,int,apps){s.zero=s.field-s.board;s.pct=s.field?s.board/s.field:0;s.intPer=s.field?int/s.field:0;s.appsPer=s.field?apps/s.field:0}

/* ---------- team summary ---------- */
function teamSummary(M){
  var g={},order=[];
  M.rows.forEach(function(r){var t=r.team||'No team';if(!g[t]){g[t]=[];order.push(t)}g[t].push(r)});
  order.sort(function(a,b){return(a==='No team')-(b==='No team')||a.localeCompare(b)});
  return{rows:order.map(function(t){return teamRow(t,g[t],M)}),total:teamRow('All teams',M.rows,M)};
}
function teamRow(name,reps,M){
  var row={name:name,wk:[],days:[],n:reps.length};
  M.weeks.forEach(function(w,wi){
    var s={units:0,int:0,dtv:0,nl:0,tk:0,tt:0,cx:0,worked:0};
    reps.forEach(function(r){var x=r.wk[wi];s.int+=x.int;s.dtv+=x.dtv;s.nl+=x.nl;s.tk+=x.tk;s.tt+=x.tt;s.cx+=x.cx;s.worked+=x.worked});
    s.units=s.int+s.dtv+s.nl;s.avgK=s.tk?div(s.tk,s.worked):'';s.avgT=s.tk?div(s.tt,s.worked):'';s.pct=s.tk?s.tt/s.tk:'';s.perUnit=s.tk?div(s.tt,s.units):'';
    row.wk.push(s);
  });
  for(var i=0;i<7;i++){var d={units:0,int:0,dtv:0,nl:0,tk:0,tt:0},iso=addIso(M.mon,i);
    reps.forEach(function(r){var c=cellOf(r.days,iso);d.int+=c.int;d.dtv+=c.dtv;d.nl+=c.nl;d.tk+=c.tk;d.tt+=c.tt});
    d.units=d.int+d.dtv+d.nl;d.pct=(!d.tk&&!d.tt)?'':(d.tk?d.tt/d.tk:'-');d.perTT=(!d.tk&&!d.tt)?'':(d.tt?d.units/d.tt:'-');row.days.push(d)}
  row.entry=reps.filter(function(r){return r.level==='Entry Level'}).length;
  row.leaders=reps.filter(function(r){return LEADER_LEVELS.indexOf(r.level)>=0}).length;
  row.active=reps.filter(function(r){return r.wk[0].apps>0&&!r.termed&&r.fs!=='1st Wk'}).length;

  row.lwUnitsAvg=row.active?row.wk[1].units/row.active:'-';row.lwIntAvg=row.active?row.wk[1].int/row.active:'-';
  return row;
}

function table(groups,rows,total,opts){
  opts=opts||{};
  var grp='<tr class="grow"><th class="n"></th><th class="name"></th>'+groups.map(function(g){
    var lab=g.tone==='day'?'<button type="button" class="daybtn" data-day="'+g.dayIdx+'" title="'+(g.open?'Collapse':'Expand')+' this day">'+esc(g.label)+'<span class="ar">'+(g.open?'◀':'▶')+'</span></button>':'<span class="glabel">'+esc(g.label)+'</span>';
    return '<th colspan="'+g.cols.length+'">'+lab+'</th>'}).join('')+'</tr>';
  var cols='<tr class="crow"><th class="n" data-sort>#</th><th class="name left" data-sort>'+esc(opts.nameHead||'Rep')+'</th>'+groups.map(function(g){
    return g.cols.map(function(c,ci){return '<th class="k-'+(c.k||'plain')+(ci===0?' sep':'')+(c.left?' left':'')+'" data-sort'+(c.title?' title="'+esc(c.title)+'"':'')+'>'+esc(c.h)+'</th>'}).join('')}).join('')+'</tr>';
  function line(r,n,isTotal,cls){
    var who=isTotal?'<span class="who">'+esc(opts.totalLabel||r.name)+'</span>'
      :(r.pk?'<span class="dot '+fsCls(r.fs)+'" title="'+esc(r.fs||'No start date')+'"></span>':'')+'<span class="who">'+esc(r.name)+'</span>'+(opts.sub?opts.sub(r):'');
    return '<tr class="'+(isTotal?'total':'')+(cls?' '+cls:'')+'"><td class="n">'+n+'</td><td class="name"><div class="nw">'+who+'</div></td>'+
      groups.map(function(g){return g.cols.map(function(c,ci){
        var html,k=[ci===0?'sep':''];
        if(g.tone==='plain'){html=(!isTotal||opts.plainTotal)&&c.v?c.v(r):'';if(c.left)k.push('left')}
        else{var raw=g.value(r,c);html=c.fmt(raw);
          if(c.k==='apps'&&(g.tone==='cur'||g.tone==='day')&&html!=='')html='<span class="'+(g.tone==='cur'?'tot '+totalCls(raw):'chip '+(isTotal||opts.noScale?'':scale(raw)))+'">'+html+'</span>';
          else if(g.tone!=='cur'&&c.k==='apps')k.push('soft');
          else if(!isTotal&&g.tone==='day'&&(raw===0||(c.k==='cx'&&raw>0)))k.push('red')}
        var cl=k.join(' ').trim();return '<td'+(cl?' class="'+cl+'"':'')+'>'+html+'</td>'}).join('')}).join('')+'</tr>';
  }

  return '<div class="scroll"><table><thead>'+grp+cols+'</thead><tbody>'+body+'</tbody></table></div>';

function sortVal(td){var t=(td.textContent||'').replace(/ /g,' ').trim();if(!t||t==='-'||t==='—')return null;
  if(/^-?[\d,]*\.?\d+%?$/.test(t))return parseFloat(t.replace(/[,%]/g,''));
  var m=/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(t);if(m)return +m[3]*1e4+ +m[1]*100+ +m[2];return t.toLowerCase()}
function sortBy(th){
  var row=th.parentNode,tb=th.closest('table').tBodies[0],idx=[].indexOf.call(row.children,th);
  var rows=[].slice.call(tb.rows).filter(function(r){return!r.classList.contains('total')}),tot=[].slice.call(tb.rows).filter(function(r){return r.classList.contains('total')});
  var vals=rows.map(function(r){return sortVal(r.cells[idx])}),isText=vals.some(function(v){return typeof v==='string'});
  var dir=th.dataset.dir?-Number(th.dataset.dir):(isText||idx===0?1:-1);
  row.querySelectorAll('th[data-dir]').forEach(function(x){delete x.dataset.dir;x.textContent=x.textContent.replace(/ [▲▼]$/,'')});
  th.dataset.dir=dir;th.textContent+=dir===1?' ▲':' ▼';
  rows.map(function(r,i){return{r:r,v:vals[i],i:i}}).sort(function(a,b){if(a.v==null&&b.v==null)return a.i-b.i;if(a.v==null)return 1;if(b.v==null)return-1;
    if(typeof a.v!==typeof b.v)return typeof a.v==='number'?-1:1;return(a.v<b.v?-1:a.v>b.v?1:a.i-b.i)*dir}).forEach(function(x){tb.appendChild(x.r)});
  tot.forEach(function(r){tb.appendChild(r)});
}

  index(d);
  st.mon=d.thisMon;
  var v=recall('view');if(v&&VIEWS.some(function(x){return x[0]===v}))st.view=v;

  paint();
}).catch(function(e){document.getElementById('app').innerHTML='<div class="err">The board data did not load ('+esc(e.message)+'). Reload the page; if it keeps failing, the data file needs to be republished.</div>'});
