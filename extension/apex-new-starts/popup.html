<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; font: 14px/1.45 -apple-system, Segoe UI, Arial, sans-serif; color: #1d2330; }
  header { background: #0F766E; color: #fff; padding: 12px 16px; font-weight: 600; font-size: 16px; }
  main { padding: 14px 16px 18px; }
  label { display: block; font-size: 12px; color: #555; margin: 8px 0 3px; }
  input, select { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #c9d3de; border-radius: 6px; font-size: 14px; }
  button { width: 100%; margin-top: 10px; padding: 11px; border: 0; border-radius: 8px;
           background: #0F766E; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
  button:disabled { background: #a7cbc7; cursor: default; }
  button.quiet { background: #e4e9ef; color: #1d2330; }
  button.link { background: none; color: #0F766E; width: auto; padding: 0; margin: 0; font-weight: 500; font-size: 13px; }
  .week { background: #effaf7; border-left: 5px solid #0F766E; border-radius: 6px;
          padding: 8px 10px; font-size: 16px; font-weight: 700; color: #0b4f4a; }
  .muted { color: #666; font-size: 13px; }
  .err { background: #FDECEA; color: #8a1c13; border-radius: 6px; padding: 8px 10px; margin-top: 10px; }
  .ok  { background: #E6F4EA; color: #1e6b34; border-radius: 6px; padding: 8px 10px; margin-top: 10px; }
  .wait{ background: #EEF2F7; color: #34495e; border-radius: 6px; padding: 8px 10px; margin-top: 10px; }
  .names { max-height: 150px; overflow: auto; font-size: 13px; margin-top: 8px; }
  .names div { padding: 2px 0; border-bottom: 1px solid #f0f0f0; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>Lucy &middot; New Starts to Apex</header>
<main>
  <!-- Sign in once per computer. Same login as the background-check one. -->
  <section id="signin" hidden>
    <p class="muted">Sign in once — this computer stays signed in.</p>
    <label>Username</label><input id="user" autocomplete="username">
    <label>Password</label><input id="pass" type="password" autocomplete="current-password">
    <button id="go">Sign in</button>
  </section>

  <section id="home" hidden>
    <div class="row"><b id="name"></b><button class="link" id="out">Sign out</button></div>

    <div id="have" hidden>
      <div class="week" id="wk"></div>
      <p class="muted" id="meta"></p>
      <div class="names" id="names"></div>
    </div>
    <p class="muted" id="none" hidden>No week loaded yet.</p>

    <button id="fetch">Get this week</button>
    <button id="forget" class="quiet" hidden>Forget this week</button>
    <div id="msg" hidden></div>
    <p class="muted">Then open Apex and press <b>Fill Apex</b>, bottom right.</p>
  </section>
</main>
<script src="popup.js"></script>
</body>
</html>
