<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 340px; margin: 0; font: 14px/1.4 -apple-system, Segoe UI, Arial, sans-serif; color: #1d2330; }
  header { background: #123E66; color: #fff; padding: 12px 16px; font-weight: 600; font-size: 16px; }
  main { padding: 14px 16px 18px; }
  label { display: block; font-size: 12px; color: #555; margin: 8px 0 3px; }
  button.second { background: #fff; color: #123E66; border: 2px solid #123E66; margin-top: 8px; }
  .showbtn { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #4a6585; margin-top: 8px; }
  .showbtn input { width: auto; }
  #last .names { margin: 6px 0 0 20px; padding: 0; color: #1d2330; }
  #last .names li { padding: 1px 0; }
  input[data-f="appstream"] { margin-bottom: 6px; }
  input, select { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #c9d3de; border-radius: 6px; font-size: 14px; }
  button { width: 100%; margin-top: 12px; padding: 10px; border: 0; border-radius: 8px; background: #1F6FB2; color: #fff; font-weight: 600; font-size: 14px; cursor: pointer; }
  button.link { background: none; color: #1F6FB2; width: auto; padding: 0; margin: 0; font-weight: 500; font-size: 13px; }
  .card { border: 1px solid #d8e2ec; border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
  .loc { background: #E8F1FB; border-left: 6px solid #1F6FB2; border-radius: 6px; padding: 8px 10px; font-size: 16px; font-weight: 600; color: #123E66; margin: 6px 0; }
  .acct { font-size: 13px; color: #333; }
  .test { background: #FFF6DB; color: #7a5a00; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 500; }
  .err { background: #FDECEA; color: #8a1c13; border-radius: 6px; padding: 8px 10px; margin-top: 10px; }
  .muted { color: #666; font-size: 13px; }
  .row { display: flex; justify-content: space-between; align-items: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>🗂️ Lucy Office Admin</header>
<main>
  <section id="signin" hidden>
    <p class="muted">Sign in once — this computer stays signed in.</p>
    <label>Username</label><input id="user" autocomplete="username">
    <label>Password</label><input id="pass" type="password" autocomplete="current-password">
    <button id="go">Sign in</button>
  </section>
  <section id="home" hidden>
    <div class="row"><b id="name"></b><button class="link" id="out">Sign out</button></div>
    <div id="offices"></div>
    <button id="run">🛡️ Send background checks</button>
    <button id="next" class="second">📅 Next week's starts (re-send the link)</button>
    <label class="showbtn"><input type="checkbox" id="showbtn"> Show the button on the calendar</label>
    <p class="muted">Open an office's ApplicantStream calendar (today) first. Lucy matches the calendar to the office by its account number.</p>
    <div id="last" class="muted"></div>
  </section>
  <div id="msg" class="err" hidden></div>
</main>
<script src="popup.js"></script>
</body>
</html>
